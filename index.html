<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>果凍快醒醒 - 全技能合成版</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #2b303b; --panel: rgba(30,34,40,0.95); --accent: #ebcb8b; --danger: #bf616a; --success: #a3be8c; --rare: #b48ead; }
        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; background: #111; font-family: 'Fredoka', sans-serif; overflow: hidden; color: #eceff4; }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* UI 層 */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; }
        .interactive { pointer-events: auto; }
        .hidden { display: none !important; }

        /* HUD */
        #hud { padding: 15px; display: flex; justify-content: space-between; font-size: 18px; text-shadow: 1px 1px 2px #000; z-index: 10; }
        .pill { background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        
        /* 技能狀態列 */
        #active-skills { 
            position: absolute; bottom: 60px; left: 10px; right: 10px; 
            display: flex; gap: 5px; overflow-x: auto; padding: 5px;
            pointer-events: auto;
        }
        .skill-icon {
            width: 40px; height: 40px; background: #434c5e; border-radius: 8px; border: 2px solid #4c566a;
            display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative;
            flex-shrink: 0;
        }
        .skill-icon.synthesis { border-color: var(--rare); box-shadow: 0 0 10px var(--rare); animation: pulse 2s infinite; }
        .skill-lv { position: absolute; bottom: -2px; right: 2px; font-size: 10px; font-weight: bold; color: #fff; text-shadow: 1px 1px 0 #000; }

        /* 選單與卡片 */
        .screen { position: absolute; top:0; left:0; width:100%; height:100%; background: var(--panel); pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); z-index: 20; }
        .card-container { display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; max-height: 70vh; overflow-y: auto; }
        
        .card { 
            background: linear-gradient(135deg, #434c5e, #2e3440); 
            border: 2px solid #81a1c1; border-radius: 12px; padding: 15px; 
            cursor: pointer; text-align: left; position: relative; transition: 0.2s;
        }
        .card:hover { transform: scale(1.02); border-color: var(--accent); }
        .card.synthesis-card { background: linear-gradient(135deg, #5e3a5e, #2e3440); border-color: var(--rare); }
        .card h3 { margin: 0 0 5px; color: #fff; display: flex; justify-content: space-between; }
        .card p { margin: 0; font-size: 12px; color: #d8dee9; }
        .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #5e81ac; }
        .tag.syn { background: var(--rare); }

        .big-btn { background: var(--success); border: none; border-bottom: 4px solid #819c6e; color: #2e3440; font-weight: bold; padding: 15px 40px; border-radius: 12px; font-size: 20px; cursor: pointer; margin-top: 20px; }
        .big-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .float-text { position: absolute; pointer-events: none; font-weight: bold; text-shadow: 1px 1px 0 #000; animation: floatUp 0.8s ease-out forwards; white-space: nowrap; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div id="hud">
        <div class="pill">🌊 Wave <span id="wave-display">1</span></div>
        <div class="pill">💀 Kills <span id="kill-display">0</span></div>
    </div>
    
    <div id="active-skills">
        <!-- JS 生成技能圖標 -->
    </div>
</div>

<!-- 主選單 -->
<div id="main-menu" class="screen">
    <h1 style="color:var(--accent); font-size:36px; margin-bottom:10px;">🔮 正中靶心：合成版</h1>
    <p style="color:#d8dee9; margin-bottom:30px;">選擇技能，達成條件，觸發隱藏合成！</p>
    <div style="text-align:left; font-size:14px; color:#aaa; margin-bottom:20px; line-height:1.6;">
        💡 合成公式提示：<br>
        🔥 火焰飛彈 = 奧術飛彈 + 火球術<br>
        🌪️ 閃電龍捲 = 龍捲風 + 閃電鏈<br>
        ❄️ 冰霜新星 = 滾木 + 冰錐術<br>
        ☄️ 燃燒隕石 = 隕石術 + 火球術<br>
        🎯 制導飛彈 = 聚焦激光 + 奧術飛彈
    </div>
    <button class="big-btn" onclick="Game.start()">開始戰鬥</button>
</div>

<!-- 升級選單 -->
<div id="level-up" class="screen hidden">
    <h2 style="color:#fff;">✨ 技能選擇</h2>
    <div id="card-list" class="card-container"></div>
</div>

<!-- 遊戲結束 -->
<div id="game-over" class="screen hidden">
    <h1 style="color:var(--danger);">GAME OVER</h1>
    <p>存活波數: <span id="final-wave" style="color:var(--accent); font-size:24px;">0</span></p>
    <button class="big-btn" onclick="location.reload()">重新挑戰</button>
</div>

<script>
/* ==================== 1. 技能資料庫 (核心) ==================== */
// 定義所有技能、前置條件、合成公式
const SKILL_DB = {
    // --- 基礎技能 ---
    'arcane': { name: '奧術飛彈', type: 'active', icon: '🔹', desc: '發射追蹤飛彈', max: 1 },
    'fireball': { name: '火球術', type: 'active', icon: '🔥', desc: '發射會爆炸的火球', max: 1 },
    'ice': { name: '冰錐術', type: 'active', icon: '❄️', desc: '發射穿透冰錐，緩速敵人', max: 1 },
    'lightning': { name: '雷擊術', type: 'active', icon: '⚡', desc: '召喚雷電攻擊單體', max: 1 },
    'log': { name: '滾木', type: 'active', icon: '🪵', desc: '滾動木頭擊退敵人', max: 1 },
    'tornado': { name: '龍捲風', type: 'active', icon: '🌪️', desc: '召喚龍捲風持續傷害', max: 1 },
    'laser': { name: '聚焦激光', type: 'active', icon: '🔦', desc: '持續照射最近敵人', max: 1 },
    'meteor': { name: '隕石術', type: 'active', icon: '☄️', desc: '召喚隕石造成大範圍傷害', max: 1 },
    'chain_light': { name: '閃電鏈', type: 'active', icon: '🔗', desc: '在敵人之間彈跳的閃電', max: 1 },
    'pulse': { name: '脈衝激光', type: 'active', icon: '〰️', desc: '發射橫向脈衝波', max: 1 },

    // --- 奧術飛彈系 ---
    'arc_dmg': { name: '飛彈增幅', req: 'arcane', desc: '飛彈傷害 +60%' },
    'arc_count': { name: '飛彈連發', req: 'arcane', desc: '飛彈數量 +1，傷害 -20%' },
    'arc_explode': { name: '爆炸飛彈', req: 'arc_dmg', desc: '飛彈命中後產生小爆炸' },
    
    // --- 火球系 ---
    'fire_dmg': { name: '火球爆破', req: 'fireball', desc: '火球傷害 +80%' },
    'fire_boom': { name: '火球爆燃', req: 'fireball', desc: '爆炸範圍 +80%' },
    'fire_multi': { name: '連珠火球', req: 'fireball', desc: '額外施放 1 次火球' },

    // --- 冰錐系 ---
    'ice_split': { name: '冰錐分裂', req: 'ice', desc: '冰錐命中後分裂成小冰錐' },
    'ice_freeze': { name: '極寒冰錐', req: 'ice', desc: '命中凍結敵人 1 秒' },

    // --- 龍捲風系 ---
    'wind_duration': { name: '強襲風暴', req: 'tornado', desc: '龍捲風持續時間 +50%' },
    'wind_pull': { name: '風暴聚集', req: 'tornado', desc: '龍捲風會吸引敵人' },

    // --- 合成技能 (Synthesis) ---
    'syn_flame_missile': { 
        name: '🔥 火焰飛彈', type: 'syn', icon: '🟣', 
        req: ['arcane', 'fireball'], 
        desc: '【合成】奧術飛彈附帶燃燒與爆炸效果' 
    },
    'syn_lightning_tornado': {
        name: '⛈️ 閃電龍捲', type: 'syn', icon: '🟣',
        req: ['tornado', 'chain_light'],
        desc: '【合成】龍捲風現在會電擊內部敵人'
    },
    'syn_frost_log': {
        name: '❄️ 冰霜新星', type: 'syn', icon: '🟣',
        req: ['log', 'ice'],
        desc: '【合成】滾木路徑留下冰霜，凍結敵人'
    },
    'syn_burn_meteor': {
        name: '🌋 燃燒隕石', type: 'syn', icon: '🟣',
        req: ['meteor', 'fireball'],
        desc: '【合成】隕石落地後燃燒地面'
    },
    'syn_guided_missile': {
        name: '🚀 制導飛彈', type: 'syn', icon: '🟣',
        req: ['laser', 'arcane'],
        desc: '【合成】聚焦激光現在會發射追蹤導彈'
    }
};

/* ==================== 2. 遊戲引擎 ==================== */
const Game = {
    canvas: document.getElementById('gameCanvas'),
    ctx: null, width: 0, height: 0,
    state: 'MENU', lastTime: 0,
    
    // 遊戲數據
    wave: 1, kills: 0, spawnTimer: 0, exp: 0, level: 1, nextExp: 10,
    hp: 100, maxHp: 100,
    
    // 實體
    enemies: [], projectiles: [], texts: [],
    
    // 技能狀態
    skills: {}, // 已學技能 { id: level }
    stats: { atk: 10, cd_mod: 1 },

    init() {
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        requestAnimationFrame(t => this.loop(t));
    },
    resize() {
        this.width = this.canvas.width = window.innerWidth;
        this.height = this.canvas.height = window.innerHeight;
    },
    start() {
        this.state = 'PLAYING';
        this.reset();
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        this.lastTime = performance.now();
        // 初始給予一個隨機基礎技能
        this.gainSkill(['arcane', 'fireball', 'ice', 'log'][Math.floor(Math.random()*4)]);
    },
    reset() {
        this.wave = 1; this.kills = 0; this.exp = 0; this.level = 1; this.hp = 100;
        this.enemies = []; this.projectiles = []; this.texts = []; this.skills = {};
        this.renderSkillBar();
    },

    loop(t) {
        if(this.state !== 'PLAYING') return requestAnimationFrame(t => this.loop(t));
        let dt = (t - this.lastTime) / 1000;
        this.lastTime = t;
        
        this.update(dt);
        this.draw();
        requestAnimationFrame(t => this.loop(t));
    },

    update(dt) {
        // 生成敵人
        this.spawnTimer += dt;
        let spawnRate = Math.max(0.5, 2.0 - this.wave * 0.1);
        if(this.spawnTimer > spawnRate) {
            this.spawnEnemy();
            this.spawnTimer = 0;
        }

        // 自動攻擊 (依據擁有的技能)
        for(let id in this.skills) {
            let data = SKILL_DB[id];
            if(data.type === 'active' || data.type === 'syn') {
                if(!this.skills[id].cooldown) this.skills[id].cooldown = 0;
                this.skills[id].cooldown -= dt;
                if(this.skills[id].cooldown <= 0) {
                    this.castSkill(id);
                    // 基礎冷卻
                    let baseCd = 1.5;
                    if(id === 'laser') baseCd = 0.5;
                    if(id === 'meteor') baseCd = 4.0;
                    if(id === 'log') baseCd = 3.0;
                    this.skills[id].cooldown = baseCd * this.stats.cd_mod; 
                }
            }
        }

        // 更新實體
        this.enemies.forEach(e => {
            let slow = e.slowTimer > 0 ? 0.5 : 1;
            if(e.slowTimer > 0) e.slowTimer -= dt;
            if(e.freezeTimer > 0) {
                e.freezeTimer -= dt;
                slow = 0; // 凍結
            }
            e.y += e.speed * slow * dt;
            if(e.y > this.height) {
                this.hp -= 10;
                e.dead = true;
                this.spawnText(this.width/2, this.height-100, "-10 HP", "red", 30);
                if(this.hp <= 0) this.gameOver();
            }
        });

        this.projectiles.forEach(p => {
            if(p.target && p.target.dead) p.target = null; // 目標死亡
            
            // 追蹤邏輯
            if(p.homing && p.target) {
                let angle = Math.atan2(p.target.y - p.y, p.target.x - p.x);
                p.vx = Math.cos(angle) * p.speed;
                p.vy = Math.sin(angle) * p.speed;
            }

            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;

            // 碰撞檢測
            if(p.type === 'laser') {
                // 激光是瞬發或持續光束，這裡簡化為生成即傷害
            } else {
                for(let e of this.enemies) {
                    if(!e.dead && Math.hypot(p.x - e.x, p.y - e.y) < e.r + p.r) {
                        this.hitEnemy(e, p);
                        if(!p.pierce) p.dead = true;
                        break;
                    }
                }
            }
        });

        // 清理
        this.enemies = this.enemies.filter(e => !e.dead);
        this.projectiles = this.projectiles.filter(p => !p.dead && p.life > 0);
        this.texts = this.texts.filter(t => { t.life -= dt; t.y -= 20*dt; return t.life > 0; });
        
        // UI
        document.getElementById('wave-display').innerText = this.wave;
        document.getElementById('kill-display').innerText = this.kills;
    },

    draw() {
        let ctx = this.ctx;
        ctx.fillStyle = '#2b303b';
        ctx.fillRect(0, 0, this.width, this.height);

        // 畫城牆
        ctx.fillStyle = '#3b4252';
        ctx.fillRect(0, this.height - 50, this.width, 50);
        ctx.fillStyle = '#a3be8c';
        ctx.fillRect(0, this.height - 55, this.width * (this.hp/100), 5);

        // 敵人
        this.enemies.forEach(e => {
            ctx.fillStyle = e.color;
            if(e.freezeTimer > 0) ctx.fillStyle = '#88c0d0'; // 凍結色
            ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
            // 血條
            ctx.fillStyle = 'red'; ctx.fillRect(e.x-10, e.y-e.r-5, 20, 4);
            ctx.fillStyle = '#a3be8c'; ctx.fillRect(e.x-10, e.y-e.r-5, 20*(e.hp/e.maxHp), 4);
        });

        // 投射物
        this.projectiles.forEach(p => {
            ctx.save();
            ctx.translate(p.x, p.y);
            if(p.emoji) {
                ctx.font = (p.r*2) + "px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(p.emoji, 0, 0);
            } else {
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        });

        // 文字特效
        this.texts.forEach(t => {
            ctx.fillStyle = t.color;
            ctx.font = "bold "+t.size+"px Fredoka";
            ctx.fillText(t.text, t.x, t.y);
        });
    },

    // --- 戰鬥邏輯 ---
    castSkill(id) {
        let target = this.enemies[0]; // 簡單瞄準最前面的
        if(!target && id !== 'meteor' && id !== 'log' && id !== 'tornado') return; // 這些技能不需要目標也能放
        
        let dmg = this.stats.atk;
        
        // 根據技能ID產生效果
        switch(id) {
            case 'arcane': // 奧術飛彈
                let count = this.skills['arc_count'] ? 2 : 1;
                dmg *= this.skills['arc_dmg'] ? 1.6 : 1.0;
                for(let i=0; i<count; i++) {
                    setTimeout(() => this.spawnProj(this.width/2, this.height-50, target, 'missile', dmg, '🔹'), i*100);
                }
                break;

            case 'fireball': // 火球
                dmg *= this.skills['fire_dmg'] ? 1.8 : 1.5;
                let fCount = this.skills['fire_multi'] ? 2 : 1;
                for(let i=0; i<fCount; i++) {
                    setTimeout(() => this.spawnProj(this.width/2, this.height-50, target, 'fireball', dmg, '🔥'), i*200);
                }
                break;

            case 'ice': // 冰錐
                let iCount = this.skills['ice_split'] ? 3 : 1;
                this.spawnProj(this.width/2, this.height-50, target, 'ice', dmg, '❄️', { pierce: true });
                break;

            case 'lightning': // 雷擊 (瞬發)
                if(target) {
                    this.spawnText(target.x, target.y - 30, "⚡", "#ebcb8b", 40);
                    this.hitEnemy(target, { dmg: dmg * 2, type: 'lightning' });
                }
                break;
            
            case 'log': // 滾木
                this.spawnProj(this.width/2, this.height-80, {x: this.width/2, y: -100}, 'log', dmg, '🪵', { r: 30, pierce: true, speed: 150 });
                break;

            case 'tornado': // 龍捲風 (原地)
                let dur = this.skills['wind_duration'] ? 3 : 2;
                this.spawnProj(Math.random()*this.width, this.height/2, null, 'tornado', dmg*0.5, '🌪️', { r: 50, life: dur, speed: 0, pierce: true });
                break;
            
            case 'laser': // 激光
                if(target) {
                    // 畫線特效簡化為直接傷害
                    this.spawnText(target.x, target.y, "🔦", "#fff", 20);
                    this.hitEnemy(target, { dmg: dmg * 0.5 });
                }
                break;
            
            case 'meteor': // 隕石
                let mx = Math.random() * this.width;
                let my = Math.random() * (this.height/2);
                this.spawnProj(mx, -50, {x: mx, y: my}, 'meteor', dmg*3, '☄️', { r: 40, speed: 200, explode: 100 });
                break;

            // --- 合成技能 ---
            case 'syn_flame_missile': // 火焰飛彈
                this.spawnProj(this.width/2, this.height-50, target, 'missile', dmg*2, '🟣', { homing: true, explode: 50, burn: true });
                break;

            case 'syn_lightning_tornado': // 閃電龍捲
                this.spawnProj(Math.random()*this.width, this.height/2, null, 'tornado', dmg, '⛈️', { r: 60, life: 3, speed: 0, pierce: true, zap: true });
                break;
            
            case 'syn_frost_log': // 冰霜新星滾木
                this.spawnProj(this.width/2, this.height-80, {x: this.width/2, y: -100}, 'log', dmg*1.5, '🧊', { r: 35, pierce: true, speed: 150, freeze: true });
                break;
            
            case 'syn_guided_missile':
                for(let i=0; i<3; i++) {
                    setTimeout(() => this.spawnProj(this.width/2, this.height-50, target, 'missile', dmg*1.2, '🚀', { homing: true }), i*100);
                }
                break;
        }
    },

    spawnProj(x, y, target, type, dmg, emoji, opts={}) {
        let angle = -Math.PI/2;
        if(target) angle = Math.atan2(target.y - y, target.x - x);
        
        let speed = opts.speed || 300;
        
        this.projectiles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            target: target,
            type: type, dmg: dmg, emoji: emoji,
            r: opts.r || 10,
            life: opts.life || 3,
            homing: opts.homing || (type === 'missile'),
            pierce: opts.pierce || false,
            explode: opts.explode || (this.skills['arc_explode'] && type==='missile' ? 30 : 0),
            freeze: opts.freeze || (this.skills['ice_freeze'] && type==='ice'),
            zap: opts.zap || false, // 閃電效果
            speed: speed
        });
    },

    hitEnemy(e, p) {
        e.hp -= p.dmg;
        this.spawnText(e.x, e.y - 20, Math.floor(p.dmg), "#fff", 20);
        
        // 特殊效果
        if(p.freeze) e.freezeTimer = 2.0;
        if(this.skills['ice'] && !p.freeze) e.slowTimer = 1.0; // 冰錐自帶緩速
        if(p.explode) {
            // 範圍傷害
            this.enemies.forEach(subE => {
                if(Math.hypot(subE.x - p.x, subE.y - p.y) < p.explode) {
                    subE.hp -= p.dmg * 0.5;
                }
            });
            this.spawnText(p.x, p.y, "💥", "#f00", 40);
        }
        if(p.zap) {
            // 閃電連鎖
            let chain = this.enemies.find(n => n !== e && Math.hypot(n.x - e.x, n.y - e.y) < 100);
            if(chain) {
                chain.hp -= p.dmg * 0.5;
                this.spawnText(chain.x, chain.y, "⚡", "#ff0", 20);
            }
        }

        if(e.hp <= 0 && !e.dead) {
            e.dead = true;
            this.kills++;
            this.exp += 2;
            if(this.exp >= this.nextExp) this.levelUp();
            // 波數進程
            if(this.kills % 10 === 0) {
                this.wave++;
                this.spawnText(this.width/2, this.height/3, "WAVE UP!", varCss('--accent'), 40);
            }
        }
    },

    spawnEnemy() {
        let hp = 10 * Math.pow(1.2, this.wave);
        this.enemies.push({
            x: Math.random() * (this.width - 40) + 20,
            y: -30,
            hp: hp, maxHp: hp,
            speed: 50 + this.wave * 2,
            r: 15,
            color: this.wave % 5 === 0 ? '#b48ead' : '#bf616a',
            slowTimer: 0,
            freezeTimer: 0,
            dead: false
        });
    },

    spawnText(x, y, text, color, size) {
        this.texts.push({x, y, text, color, size, life: 1.0});
    },

    // --- 升級系統 (合成邏輯) ---
    levelUp() {
        this.level++;
        this.exp = 0;
        this.nextExp = Math.floor(this.nextExp * 1.5);
        this.state = 'PAUSED';
        
        // 產生選項
        let pool = [];
        
        // 1. 檢查合成 (隱藏技能)
        for(let id in SKILL_DB) {
            let s = SKILL_DB[id];
            if(s.type === 'syn' && !this.skills[id]) {
                // 檢查是否滿足條件 (擁有前置技能)
                let meet = true;
                if(Array.isArray(s.req)) {
                    s.req.forEach(r => { if(!this.skills[r]) meet = false; });
                }
                if(meet) pool.push(id); // 優先加入合成技能
            }
        }

        // 2. 檢查現有技能升級 & 解鎖後續
        for(let id in SKILL_DB) {
            let s = SKILL_DB[id];
            // 排除合成技能(已處理)與已滿級技能
            if(s.type === 'syn' || (this.skills[id] && s.max && this.skills[id]>=s.max)) continue;
            
            // 檢查前置
            if(!s.req) {
                // 無前置 (基礎技能)，如果還沒學過，或是可以重複升級
                if(!this.skills[id]) pool.push(id);
            } else if (typeof s.req === 'string') {
                // 有前置技能，必須先學會前置
                if(this.skills[s.req] && !this.skills[id]) pool.push(id);
            }
        }

        // 隨機選 3 個
        let choices = [];
        for(let i=0; i<3; i++) {
            if(pool.length === 0) break;
            let idx = Math.floor(Math.random() * pool.length);
            choices.push(pool[idx]);
            pool.splice(idx, 1);
        }
        if(choices.length === 0) choices.push('heal'); // 沒技能可學就補血

        this.renderCards(choices);
        document.getElementById('level-up').classList.remove('hidden');
    },

    renderCards(ids) {
        let container = document.getElementById('card-list');
        container.innerHTML = '';
        ids.forEach(id => {
            if(id === 'heal') {
                let div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<h3>💖 恢復 <span class="tag">補給</span></h3><p>恢復 30% 生命值</p>`;
                div.onclick = () => { 
                    this.hp = Math.min(this.maxHp, this.hp + 30); 
                    this.resume(); 
                };
                container.appendChild(div);
                return;
            }

            let s = SKILL_DB[id];
            let div = document.createElement('div');
            div.className = `card ${s.type === 'syn' ? 'synthesis-card' : ''}`;
            
            let tagClass = s.type === 'syn' ? 'tag syn' : 'tag';
            let tagName = s.type === 'syn' ? '合成' : (s.type==='active'?'主動':'被動');

            div.innerHTML = `
                <h3>${s.icon} ${s.name} <span class="${tagClass}">${tagName}</span></h3>
                <p>${s.desc}</p>
            `;
            div.onclick = () => this.gainSkill(id);
            container.appendChild(div);
        });
    },

    gainSkill(id) {
        if(!this.skills[id]) this.skills[id] = 1;
        else this.skills[id]++;

        // 檢查如果是合成技能，移除舊的基礎技能(可選，這裡保留基礎技能讓場面更混亂好玩)
        // 但為了 UI 乾淨，我們只在狀態列顯示圖標
        
        this.renderSkillBar();
        this.resume();
    },

    resume() {
        document.getElementById('level-up').classList.add('hidden');
        this.state = 'PLAYING';
        this.lastTime = performance.now();
    },

    renderSkillBar() {
        let bar = document.getElementById('active-skills');
        bar.innerHTML = '';
        for(let id in this.skills) {
            let s = SKILL_DB[id];
            // 只顯示主動和合成技能
            if(s.type === 'active' || s.type === 'syn') {
                let div = document.createElement('div');
                div.className = `skill-icon ${s.type==='syn'?'synthesis':''}`;
                div.innerHTML = `${s.icon}`;
                bar.appendChild(div);
            }
        }
    },
    
    gameOver() {
        this.state = 'GAMEOVER';
        document.getElementById('final-wave').innerText = this.wave;
        document.getElementById('game-over').classList.remove('hidden');
    }
};

// CSS 變數輔助
function varCss(name) { return getComputedStyle(document.documentElement).getPropertyValue(name); }

// 初始化
Game.init();

</script>
