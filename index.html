<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>果凍快醒醒 (測試加強版)</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #2b303b; --panel: rgba(30,34,40,0.9); --accent: #ebcb8b; --danger: #bf616a;
        }
        body { margin: 0; background: #111; font-family: 'Fredoka', sans-serif; overflow: hidden; color: white; }
        canvas { display: block; width: 100%; height: 100vh; }

        /* UI 區域 */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .interactive { pointer-events: auto; }

        /* 右上角：倍速控制 */
        #speed-panel {
            position: absolute; top: 10px; right: 10px;
            background: var(--panel); padding: 8px; border-radius: 10px;
            display: flex; gap: 5px; flex-direction: column; align-items: center;
            backdrop-filter: blur(4px); border: 1px solid #4c566a;
        }
        .speed-btn {
            background: #5e81ac; border: none; color: white; padding: 5px 10px;
            border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; width: 100%;
        }
        .speed-btn.active { background: #88c0d0; color: #2e3440; font-weight: bold; box-shadow: 0 0 5px #88c0d0; }

        /* 左下角：被動抽卡 */
        #passive-panel {
            position: absolute; bottom: 20px; left: 20px;
            background: var(--panel); padding: 15px; border-radius: 12px;
            max-width: 200px; border: 1px solid #ebcb8b;
        }
        #passive-list {
            font-size: 12px; color: #d8dee9; margin-bottom: 10px;
            max-height: 100px; overflow-y: auto; min-height: 20px;
        }
        #draw-btn {
            background: var(--accent); color: #2e3440; border: none;
            width: 100%; padding: 10px; border-radius: 8px;
            font-weight: bold; cursor: pointer; font-size: 14px;
            border-bottom: 3px solid #d08770;
        }
        #draw-btn:active { transform: translateY(2px); border-bottom: 0; }

        /* 頂部資訊 */
        #hud {
            position: absolute; top: 10px; left: 10px;
            font-size: 18px; text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div id="hud">
        <div>Wave: <span id="wave-txt">1</span></div>
        <div style="font-size:14px; color:#aaa">Enemies: <span id="count-txt">0</span></div>
    </div>

    <!-- 倍速控制 -->
    <div id="speed-panel" class="interactive">
        <div style="font-size:10px; color:#aaa; margin-bottom:2px;">GAME SPEED</div>
        <button class="speed-btn active" onclick="setSpeed(1, this)">x1</button>
        <button class="speed-btn" onclick="setSpeed(2, this)">x2</button>
        <button class="speed-btn" onclick="setSpeed(5, this)">x5</button>
        <button class="speed-btn" onclick="setSpeed(10, this)">x10</button>
    </div>

    <!-- 抽卡測試 -->
    <div id="passive-panel" class="interactive">
        <div style="color:var(--accent); font-weight:bold; margin-bottom:5px;">✨ 神秘天賦</div>
        <div id="passive-list">無</div>
        <button id="draw-btn" onclick="Game.drawCard()">🎲 隨機抽卡</button>
    </div>
</div>

<script>
/* --- 1. 圖片資源 (SVG) --- */
const IMAGES = {};
const SVG_SRC = {
    cat: `data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48ZWxsaXBzZSBjeD0iNTAiIGN5PSI2MCIgcng9IjQwIiByeT0iMzUiIGZpbGw9IiNmZmZmZmYiLz48cGF0aCBkPSJNMjAsMzUgTDMwLDUgTDUwLDI1IFoiIGZpbGw9IiNmZmZmZmYiLz48cGF0aCBkPSJNODAsMzUgTDcwLDUgTDUwLDI1IFoiIGZpbGw9IiNmZmZmZmYiLz48Y2lyY2xlIGN4PSIzNSIgY3k9IjU1IiByPSI1IiBmaWxsPSIjMzMzIi8+PGNpcmNsZSBjeD0iNjUiIGN5PSI1NSIgcj0iNSIgZmlsbD0iIzMzMyIvPjwvc3ZnPg==`,
    slime: `data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cGF0aCBkPSJNNTAsMjAgQzIwLDIwIDEwLDYwIDEwLDgwIEMxMCw5MCAzMCw5NSA1MCw5NSBDNzAsOTUgOTAsOTAgOTAsODAgQzkwLDYwIDgwLDIwIDUwLDIwIFoiIGZpbGw9IiNhM2JlOGMiLz48Y2lyY2xlIGN4PSIzNSIgY3k9IjUwIiByPSI1IiBmaWxsPSIjMmUzNDQwIi8+PGNpcmNsZSBjeD0iNjUiIGN5PSI1MCIgcj0iNSIgZmlsbD0iIzJlMzQ0MCIvPjwvc3ZnPg==`,
    boss: `data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cGF0aCBkPSJNMzAsMjAgTDQwLDUgTDUwLDIwIEw2MCw1IEw3MCwyMCBaIiBmaWxsPSIjZWJjYjhiIi8+PHBhdGggZD0iTTUwLDI1IEMxNSwyNSA1LDc1IDUsOTAgQzUsOTggMzAsOTggNTAsOTggQzcwLDk4IDk1LDk4IDk1LDkwIEM5NSw3NSA4NSwyNSA1MCwyNSBaIiBmaWxsPSIjYmY2MTZhIi8+PHBhdGggZD0iTTMwLDUwIEw0MCw2MCBMMzAsNzAiIGZpbGw9IiMyZTM0NDAiLz48cGF0aCBkPSJRNzAsNTAgNjAsNjAgNzAsNzAiIGZpbGw9IiMyZTM0NDAiLz48L3N2Zz4=`
};
function loadImages() { for(let k in SVG_SRC){ let i=new Image(); i.src=SVG_SRC[k]; IMAGES[k]=i; } }

/* --- 2. 遊戲引擎 --- */
let speedMult = 1;

function setSpeed(val, btn) {
    speedMult = val;
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

const Game = {
    canvas: document.getElementById('gameCanvas'),
    ctx: null,
    width: 0, height: 0,
    lastTime: 0,
    
    // 遊戲狀態
    wave: 1,
    spawnTimer: 0,
    enemies: [],
    projectiles: [],
    particles: [],
    damageTexts: [],
    
    // 玩家數值
    player: { x:0, y:0, atk:10, atkSpd:800, atkTimer:0, crit:0.05, multiShot:0 },
    passives: [],

    init() {
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        loadImages();
        
        this.player.x = this.width / 2;
        this.player.y = this.height - 100;

        requestAnimationFrame(t => this.loop(t));
    },

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        if(this.player) { this.player.x = this.width/2; this.player.y = this.height-100; }
    },

    // 抽卡邏輯
    drawCard() {
        const pool = [
            { t: "🔥 傷害 +5", f: () => this.player.atk += 5 },
            { t: "⚡ 攻速 +10%", f: () => this.player.atkSpd *= 0.9 },
            { t: "🎯 暴擊 +5%", f: () => this.player.crit += 0.05 },
            { t: "🏹 多重射擊", f: () => this.player.multiShot += 1 },
            { t: "🌊 擊退力 UP", f: () => {} } // 視覺效果
        ];
        const pick = pool[Math.floor(Math.random() * pool.length)];
        pick.f();
        
        this.passives.push(pick.t);
        document.getElementById('passive-list').innerHTML = this.passives.join('<br>');
        
        // 特效
        this.spawnText(this.player.x, this.player.y - 50, pick.t, '#ebcb8b', 20);
    },

    loop(t) {
        let dt = t - this.lastTime;
        this.lastTime = t;
        
        // 核心修正：使用 delta time * speedMult 來控制速度，而不是跑很多次迴圈
        if (dt > 100) dt = 100; // 防止切換視窗時的時間爆衝
        this.update(dt * speedMult);
        this.draw();
        
        requestAnimationFrame(time => this.loop(time));
    },

    update(dt) {
        // 1. 生成敵人 (依波數邏輯)
        this.spawnTimer += dt;
        let spawnRate = Math.max(200, 1500 - (this.wave * 50));
        if (this.spawnTimer > spawnRate) {
            this.spawnEnemy();
            this.spawnTimer = 0;
        }

        // 2. 玩家攻擊
        this.player.atkTimer += dt;
        if (this.player.atkTimer > this.player.atkSpd) {
            this.shoot();
            this.player.atkTimer = 0;
        }

        // 3. 更新敵人位置
        this.enemies.forEach(e => {
            e.y += e.speed * (dt / 16);
            if (e.y > this.height) e.dead = true; // 超出邊界移除
        });
        this.enemies = this.enemies.filter(e => !e.dead);

        // 4. 更新子彈
        this.projectiles.forEach(p => {
            p.x += p.vx * (dt / 16);
            p.y += p.vy * (dt / 16);
            
            // 碰撞判定
            for (let e of this.enemies) {
                if (Math.hypot(p.x - e.x, p.y - e.y) < e.r + p.r) {
                    this.dealDamage(e, p.dmg);
                    p.dead = true;
                    this.spawnParticle(e.x, e.y, 5, p.color);
                    break;
                }
            }
            if (p.x < 0 || p.x > this.width || p.y < 0 || p.y > this.height) p.dead = true;
        });
        this.projectiles = this.projectiles.filter(p => !p.dead);

        // 5. 更新特效
        this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= dt; });
        this.particles = this.particles.filter(p => p.life > 0);
        
        this.damageTexts.forEach(t => { t.y -= 0.5 * (dt/16); t.life -= dt; });
        this.damageTexts = this.damageTexts.filter(t => t.life > 0);

        // 更新UI
        document.getElementById('wave-txt').innerText = this.wave;
        document.getElementById('count-txt').innerText = this.enemies.length;
        
        // 簡單的波數推進
        if(this.enemies.length === 0 && this.spawnTimer === 0) {
           // 空檔期
        }
    },

    draw() {
        const ctx = this.ctx;
        ctx.fillStyle = '#2b303b';
        ctx.fillRect(0, 0, this.width, this.height);

        // 畫玩家 (貓咪)
        if (IMAGES.cat) ctx.drawImage(IMAGES.cat, this.player.x - 30, this.player.y - 30, 60, 60);

        // 畫敵人
        this.enemies.forEach(e => {
            let img = e.boss ? IMAGES.boss : IMAGES.slime;
            if (img) ctx.drawImage(img, e.x - e.r, e.y - e.r, e.r*2, e.r*2);
            
            // 血條
            ctx.fillStyle = 'red'; ctx.fillRect(e.x-15, e.y-e.r-8, 30, 4);
            ctx.fillStyle = '#a3be8c'; ctx.fillRect(e.x-15, e.y-e.r-8, 30 * (e.hp/e.maxHp), 4);
        });

        // 畫子彈
        this.projectiles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
        });

        // 畫粒子
        this.particles.forEach(p => {
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 300;
            ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1;
        });

        // 畫文字
        ctx.font = "bold 16px Fredoka";
        ctx.textAlign = "center";
        this.damageTexts.forEach(t => {
            ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
        });
    },

    spawnEnemy() {
        let isBoss = (Math.random() < 0.05); // 5% 機率 Boss
        let hp = isBoss ? 500 + (this.wave * 100) : 30 + (this.wave * 10);
        this.enemies.push({
            x: Math.random() * (this.width - 40) + 20,
            y: -50,
            hp: hp, maxHp: hp,
            r: isBoss ? 40 : 20,
            speed: isBoss ? 0.5 : 1 + (Math.random() * 0.5),
            boss: isBoss,
            dead: false
        });
    },

    shoot() {
        let target = this.enemies[0]; // 簡單瞄準第一個
        if (!target) return; // 沒敵人不射擊

        let count = 1 + this.player.multiShot;
        for(let i=0; i<count; i++) {
            let angle = Math.atan2(target.y - this.player.y, target.x - this.player.x);
            // 散佈射擊
            angle += (i - (count-1)/2) * 0.2; 
            
            this.projectiles.push({
                x: this.player.x, y: this.player.y,
                vx: Math.cos(angle) * 10,
                vy: Math.sin(angle) * 10,
                r: 6, color: '#ebcb8b', dmg: this.player.atk, dead: false
            });
        }
    },

    dealDamage(e, dmg) {
        let isCrit = Math.random() < this.player.crit;
        if(isCrit) dmg *= 1.5;
        e.hp -= dmg;
        this.spawnText(e.x, e.y-20, Math.floor(dmg), isCrit?'#ebcb8b':'#fff');
        if(e.hp <= 0) {
            e.dead = true;
            this.wave += 0.1; // 殺敵推進波數進度
            if(Math.floor(this.wave) > Math.floor(this.wave-0.1)) {
                 this.spawnText(this.width/2, this.height/3, "WAVE UP!", "#88c0d0", 30);
            }
        }
    },

    spawnParticle(x, y, count, color) {
        for(let i=0; i<count; i++) {
            this.particles.push({
                x:x, y:y,
                vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
                life: 300, color: color
            });
        }
    },

    spawnText(x, y, text, color, size=16) {
        this.damageTexts.push({ x:x, y:y, text:text, color:color, life:500, size:size });
    }
};

Game.init();
</script>
</body>
</html>
